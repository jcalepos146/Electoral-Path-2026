name: Check data and scenario calculations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/dash.js
          node --check assets/environment-model.js
          node --check assets/environment.js
          node --check assets/turnout.js
          node --check assets/presidential-model.js
          node --check assets/presidential.js
          node --check assets/war-model.js
          node --check assets/war.js
      - name: Check counterfactual and simulator calculations
        run: node --test tests/*.test.cjs
      - name: Check refresh failure handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
