name: Build, refresh data, and deploy Pages

on:
  push:
    branches: ["main"]

  workflow_dispatch:

  schedule:
    # Refresh polling data once per hour
    - cron: "17 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DATA_SOURCE_1_KEY: ${{ secrets.DATA_SOURCE_1_KEY }}
      DATA_SOURCE_2_KEY: ${{ secrets.DATA_SOURCE_2_KEY }}
      DATA_SOURCE_3_KEY: ${{ secrets.DATA_SOURCE_3_KEY }}
      ELECTION_PATH_USER_AGENT: ${{ vars.ELECTION_PATH_USER_AGENT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh polling aggregate data
        run: npm run update-data

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static Next.js site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
