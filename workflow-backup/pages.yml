name: Build, refresh data, and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # Refresh once per hour. GitHub cron uses UTC.
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["Refresh congressional district geometry"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Optional API-key slots used by config/sources.json.
      DATA_SOURCE_1_KEY: ${{ secrets.DATA_SOURCE_1_KEY }}
      DATA_SOURCE_2_KEY: ${{ secrets.DATA_SOURCE_2_KEY }}
      DATA_SOURCE_3_KEY: ${{ secrets.DATA_SOURCE_3_KEY }}
      ELECTION_PATH_USER_AGENT: ${{ vars.ELECTION_PATH_USER_AGENT }}
      # Optional America First Insight topline fallback when its client-rendered chart cannot be parsed.
      AFI_GENERIC_DEM: ${{ vars.AFI_GENERIC_DEM }}
      AFI_GENERIC_REP: ${{ vars.AFI_GENERIC_REP }}
      AFI_GENERIC_MARGIN: ${{ vars.AFI_GENERIC_MARGIN }}
      AFI_GENERIC_ASOF: ${{ vars.AFI_GENERIC_ASOF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh polling aggregate data
        run: npm run update-data

      - name: Build weekly HillCast district map data
        run: npm run update-districts

      - name: Build static Next.js site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
